  <script>
    (() => {
      const W = 14;
      const root = document.getElementById('walk');

      const w = IW.create(panel, { film: true });

      const $ = (s) => root.querySelector(s);
      const details = $('[data-r="rules"]'), tog = $('[data-rule="indirect"]'), toast = $('[data-r="toast"]');
      const flows = [...root.querySelectorAll('.e-flow')];
      // measure once
      const base = root.getBoundingClientRect();
      const ctr = (el) => { const r = el.getBoundingClientRect(); return { x: r.left - base.left + r.width / 2, y: r.top - base.top + r.height / 2, r }; };
      details.open = true; const P_tog = ctr(tog.parentElement.querySelector('span')); const P_sum = ctr(details.querySelector('summary'));
      const P_esc = ctr($('[data-act="escalate"]')); const P_score = ctr($('.inv-gauge'));
      details.open = false; const P_sum0 = ctr(details.querySelector('summary'));
      const P_card = sq ? ctr($('.inv-bar')) : ctr($('#walk-card-0'));
      const start = { x: sq ? 900 : 1500, y: sq ? 980 : 980 };
      // cursor path: [time, x, y]
      const K = [[0, start.x, start.y], [0.6, start.x, start.y], [1.25, P_card.x + 30, P_card.y + 8], [6.4, P_card.x + 30, P_card.y + 8], [7.0, P_sum0.x - 60, P_sum0.y], [7.5, P_tog.x, P_tog.y], [9.1, P_tog.x, P_tog.y], [9.75, P_esc.x, P_esc.y], [14, P_esc.x, P_esc.y]];
      const CLICKS = [1.35, 7.05, 7.9, 9.85];
      const easeIO = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      function cursorAt(t) { for (let i = 1; i < K.length; i++) if (t <= K[i][0]) { const [t0, x0, y0] = K[i - 1], [t1, x1, y1] = K[i]; const p = easeIO(clamp((t - t0) / (t1 - t0 || 1))); return [x0 + (x1 - x0) * p, y0 + (y1 - y0) * p]; } const L = K[K.length - 1]; return [L[1], L[2]]; }

      ring.setAttribute('width', rx * 2 + 20); ring.setAttribute('height', ry * 2 + 20);
      ring.style.left = (P_score.x - rx - 10) + 'px'; ring.style.top = (P_score.y - ry - 10) + 'px';
      ringP.setAttribute('d', `M ${rx + 10 + rx * 0.9} ${ry + 10 - ry * 0.5} A ${rx} ${ry} 0 1 1 ${rx + 10 + rx * 0.98} ${ry + 10 + ry * 0.15}`);
      const RL = 2 * Math.PI * Math.max(rx, ry); ringP.style.strokeDasharray = RL;
      call.style.left = (P_score.r.left - base.left + 8) + 'px'; call.style.top = (P_score.r.top - base.top - 62) + 'px';
      function renderAt(t) {

        const rulesOff = t >= 7.9;
        if (rulesOff) w.setRules({ indirect: false }, wt(7.9), w.score().score === 81 ? 81 : 81); else w.setRules({}, -1, 0);
        w.paintAt(Math.max(0, wt(t)));
        details.open = t >= 7.05;
        tog.checked = !rulesOff;
        flows.forEach((f) => { f.style.strokeDashoffset = (-t * 22).toFixed(1); });
        toast.hidden = !(t >= 9.85 && t < 11.5);
        toast.textContent = 'Demo: no action taken (escalate to investigator)';
        $('#walk-card-0').classList.toggle('on', t >= 1.35);
        const pill = $('#walk-pill-0'); const done = wt(t) >= IW.DUR;
        pill.className = 'wc-pill ' + (done ? 'p-high' : 'p-none'); pill.textContent = done ? 'High' : t >= 1.35 ? 'running' : 'not run';
        // cursor + click ripple
        const [cx, cy] = cursorAt(t);
        cur.style.transform = `translate(${cx - 4}px, ${cy - 3}px)`;
        let rp = 0; for (const c of CLICKS) if (t >= c && t < c + 0.45) rp = (t - c) / 0.45;
        rip.style.opacity = rp ? (1 - rp).toFixed(3) : 0;
        rip.style.transform = `translate(${cx}px, ${cy}px) scale(${0.4 + rp * 1.1})`;
        // score callout 4.9–6.6, and again after the rule change
        const ringOn = (t >= 4.9 && t < 6.6) || (t >= 8.2 && t < 10.7);
        const rs = t >= 8.2 ? 8.2 : 4.9;
        ringP.style.strokeDashoffset = ringOn ? (RL * (1 - easeIO(clamp((t - rs) / 0.5)))).toFixed(1) : RL;
        call.style.opacity = ringOn ? clamp((t - rs - 0.3) / 0.3).toFixed(2) : 0;
        call.textContent = t >= 8.2 ? 'Rule off: indirect exposure not counted' : 'Risk score: 81, high';
        // end card
        end.style.opacity = clamp((t - 11.5) / 0.3).toFixed(3);
      }
      const proxy = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(proxy, { t: 0 }, { t: W, duration: W, ease: 'none', onUpdate: () => renderAt(proxy.t) }, 0);
      tl.fromTo('#walk-head', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.05);
      tl.fromTo('#walk-panel', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.15);
      tl.fromTo('#walk-cards', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, 0.2);
      renderAt(0);
      window.__timelines['walk'] = tl;
    })();
  </script>
